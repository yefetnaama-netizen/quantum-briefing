name: Daily headlines

on:
  schedule:
    - cron: "0 10 * * *"   # about 6:00 AM Eastern
    - cron: "0 20 * * *"   # about 4:00 PM Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: headlines
  cancel-in-progress: false

jobs:
  headlines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install feedparser

      - name: Collect headlines and papers
        run: python scripts/feeds.py

      - name: Publish
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Headlines $(date -u +%F-%H%M)"
          git push
